<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Estudiantes | Panel Docente</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
  <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <nav class="menu">
        <a class="menu-item" href="{{ url_for('home') }}">⌂ Inicio</a>
        <a class="menu-item" href="{{ url_for('grupos') }}">♧ Mis grupos</a>
        <a class="menu-item active" href="{{ url_for('estudiantes') }}">♙ Estudiantes</a>
      </nav>
    </aside>

    <main class="main-content">
      <h1>Resumen de Estudiantes</h1>

      {% if data_error %}
        <div class="data-alert">{{ data_error }}</div>
      {% else %}
        <table class="matrix">
          <thead>
            <tr>
              <th>CLEI / Hoja</th>
              <th>Total registros</th>
            </tr>
          </thead>
          <tbody>
            {% for row in summary %}
              <tr>
                <td>{{ row["CLEI"] }}</td>
                <td>{{ row["total_registros"] }}</td>
              </tr>
            {% endfor %}
          </tbody>
        </table>

        <div id="chart"></div>
        <script>
          const data = [{
            x: {{ summary|map(attribute='CLEI')|list|tojson }},
            y: {{ summary|map(attribute='total_registros')|list|tojson }},
            type: 'bar',
            name: 'Registros',
            marker: {color: '#078f91'}
          }];
          const layout = {title: 'Registros por hoja'};
          Plotly.newPlot('chart', data, layout);
        </script>
      {% endif %}
    </main>
  </div>
</body>
</html>
