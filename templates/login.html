<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Iniciar sesión | Panel Docente</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
</head>

<body>
    <main class="login-container">
        <section class="login-card">
            <header class="login-header">
                <img
                    src="{{ url_for('static', filename='docente.jpg') }}"
                    alt="Imagen del docente"
                >

                <h1>Panel Docente</h1>
                <p>Diego Hoyos · Matemáticas y Ciencias Naturales</p>
            </header>

            <form class="login-form" method="POST" action="{{ url_for('login') }}">
                <h2>Iniciar sesión</h2>

                {% if error %}
                    <div class="error-message" role="alert">
                        {{ error }}
                    </div>
                {% endif %}

                <div class="field">
                    <label for="username">Usuario</label>
                    <input
                        type="text"
                        id="username"
                        name="username"
                        autocomplete="username"
                        required
                        autofocus
                    >
                </div>

                <div class="field">
                    <label for="password">Contraseña</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        autocomplete="current-password"
                        required
                    >
                </div>

                <button class="submit-button" type="submit">
                    Entrar al panel
                </button>
            </form>

            <footer class="login-footer">
                Acceso privado para el docente
            </footer>
        </section>
    </main>
</body>
</html>
